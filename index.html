<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16233A">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./ikon/ikon-192.png">
<link rel="apple-touch-icon" href="./ikon/ikon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WordNexus">
<title>WordNexus — İngilizce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --murekkep:#16233A;
  --zemin:#F6F7F9;
  --kart:#FFFFFF;
  --fosforlu:#FFE45C;
  --dogru:#1F8A70;
  --yanlis:#D93F4C;
  --soluk:#6B7280;
  --cizgi:#E4E7EC;
  --vurgu-yazi:#16233A;   /* fosforlu uzerindeki yazi rengi */
  --sik-secili:#EDF1F7;

  --display:"Fraunces",Georgia,serif;
  --govde:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace;

  --bosluk:16px;
  --yuvarlak:14px;
}

/* Koyu tema. Fosforlu sari koyu zeminde de imza renk olarak kaliyor ama
   uzerindeki yazi lacivert kaliyor: sari-uzeri-beyaz okunmaz. */
:root[data-tema="koyu"]{
  --murekkep:#E8ECF3;
  --zemin:#0E1626;
  --kart:#162134;
  --fosforlu:#F2D14B;
  --dogru:#3FBF9E;
  --yanlis:#F0707C;
  --soluk:#94A0B4;
  --cizgi:#26344C;
  --sik-secili:#1E2C44;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--zemin);
  color:var(--murekkep);
  font-family:var(--govde);
  font-size:16px;
  line-height:1.55;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}

/* --- iskelet --- */
.ust{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;gap:12px;
  padding:12px var(--bosluk);
  background:color-mix(in srgb, var(--zemin) 88%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--cizgi);
}
.marka{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em}
.ust .bosluk{flex:1}

main{max-width:640px;margin:0 auto;padding:var(--bosluk) var(--bosluk) 64px}

h1{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.2;margin:8px 0 4px;letter-spacing:-.02em}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:28px 0 10px}
p{margin:0 0 12px}
.soluk{color:var(--soluk)}
.kucuk{font-size:14px}

/* --- kart --- */
.kart{
  background:var(--kart);
  border:1px solid var(--cizgi);
  border-radius:var(--yuvarlak);
  padding:var(--bosluk);
  margin-bottom:12px;
}
.kart.tiklanir{cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;display:block}
.kart.tiklanir:hover{border-color:var(--soluk)}

/* --- dugmeler --- */
button{font:inherit;color:inherit}
.dugme{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:12px 20px;
  background:var(--murekkep);color:var(--zemin);
  border:none;border-radius:10px;
  font-weight:600;cursor:pointer;
}
.dugme:hover{background:color-mix(in srgb, var(--murekkep) 88%, #7f8ea8)}
.dugme.ikincil{background:transparent;color:var(--murekkep);border:1px solid var(--cizgi)}
.dugme.ikincil:hover{background:var(--kart)}
.dugme:disabled{opacity:.45;cursor:default}
.dugme.tam{width:100%}

:focus-visible{outline:3px solid var(--murekkep);outline-offset:2px;border-radius:4px}

/* --- soru --- */
.ilerleme-cubuk{height:4px;background:var(--cizgi);border-radius:99px;overflow:hidden;margin-bottom:20px}
.ilerleme-cubuk > i{display:block;height:100%;background:var(--murekkep);transition:width .25s ease}

.sayac{font-family:var(--display);font-size:14px;color:var(--soluk);margin-bottom:8px}

/* geri/ileri oklari */
.gezinti{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ok{
  flex:0 0 auto;min-width:44px;height:44px;
  display:grid;place-items:center;
  background:var(--kart);border:1px solid var(--cizgi);border-radius:10px;
  font-size:19px;line-height:1;cursor:pointer;color:var(--murekkep);
}
.ok:hover:not(:disabled){border-color:var(--soluk)}
.ok:disabled{opacity:.35;cursor:default}

/* "Bilmiyorum" daha once secilmisse geri gelindiginde belli olsun */
.dugme.ikincil.secili{
  background:var(--sik-secili);border-color:var(--murekkep);
  box-shadow:inset 0 0 0 1px var(--murekkep);
}

.parca{
  background:var(--kart);border:1px solid var(--cizgi);border-radius:var(--yuvarlak);
  padding:var(--bosluk);margin-bottom:14px;
  font-family:var(--mono);font-size:14.5px;line-height:1.7;
  max-height:38vh;overflow-y:auto;
}

.soru-metni{
  font-family:var(--mono);font-size:17px;line-height:1.75;
  margin:0 0 18px;
}
.soru-metni .bosluk-isaret{
  background:var(--fosforlu);color:var(--vurgu-yazi);border-radius:3px;padding:0 6px;
}

.sik-liste{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.sik{
  display:flex;align-items:center;gap:12px;
  min-height:52px;padding:12px 14px;
  background:var(--kart);border:1px solid var(--cizgi);border-radius:10px;
  font-family:var(--mono);font-size:15px;text-align:left;cursor:pointer;width:100%;
}
.sik:hover:not(:disabled){border-color:var(--soluk)}
.sik .harf{
  flex:0 0 26px;height:26px;display:grid;place-items:center;
  border:1px solid var(--cizgi);border-radius:6px;
  font-family:var(--govde);font-size:13px;font-weight:600;color:var(--soluk);
}
/* Secili sik acikca belli olmali: kalin kenarlik + zemin tonu + dolu harf rozeti.
   Kenarlik kalinligi degil box-shadow kullaniyoruz ki yerlesim kaymasin. */
.sik.secili{
  border-color:var(--murekkep);
  box-shadow:inset 0 0 0 1.5px var(--murekkep);
  background:var(--sik-secili);
  font-weight:500;
}
.sik.secili .harf{background:var(--murekkep);color:var(--zemin);border-color:var(--murekkep)}
.sik.dogru{border-color:var(--dogru);background:color-mix(in srgb, var(--dogru) 10%, var(--kart))}
.sik.dogru .harf{border-color:var(--dogru);color:var(--dogru)}
.sik.yanlis{border-color:var(--yanlis);background:color-mix(in srgb, var(--yanlis) 10%, var(--kart))}
.sik.yanlis .harf{border-color:var(--yanlis);color:var(--yanlis)}
.sik:disabled{cursor:default}

/* --- konu karti (alistirma) --- */
.konu-kart .etiket{
  display:block;font-size:11.5px;font-weight:600;color:var(--soluk);
  text-transform:uppercase;letter-spacing:.06em;
}
.konu-kart .kural-metni{font-size:16px;line-height:1.6}
.konu-kart .yapi{
  font-family:var(--mono);font-size:14px;line-height:1.7;
  background:var(--zemin);border-radius:10px;padding:11px 13px;margin-bottom:14px;
}
.konu-kart .ornek{margin-bottom:14px}
.konu-kart .ornek .en{
  font-family:var(--mono);font-size:15px;line-height:1.6;
  border-left:3px solid var(--fosforlu);padding-left:11px;
}
.konu-kart .ornek .tr{font-size:14px;padding-left:14px;margin-top:3px}
.konu-kart .tuzak-kutu{
  background:color-mix(in srgb, var(--fosforlu) 14%, var(--kart));border:1px solid color-mix(in srgb, var(--fosforlu) 45%, var(--kart));border-radius:10px;padding:11px 13px;
}

/* --- gunluk kuyruk kutusu (ana sayfa) --- */
.kuyruk{
  background:var(--murekkep);color:var(--zemin);border-radius:var(--yuvarlak);
  padding:18px var(--bosluk);margin-bottom:12px;
}
.kuyruk h2{font-family:var(--display);font-size:21px;margin:0 0 4px;color:var(--zemin)}
.kuyruk p{margin:0 0 14px;font-size:14.5px;opacity:.78}
.kuyruk .dugme{background:var(--zemin);color:var(--murekkep);width:100%}
.kuyruk .dugme:hover{background:color-mix(in srgb, var(--zemin) 88%, var(--soluk))}
.seri{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:600;background:rgba(255,255,255,.14);
  padding:4px 10px;border-radius:99px;margin-bottom:8px;
}

/* --- harita --- */
.harita{display:flex;flex-direction:column;gap:10px}
.blok{
  display:flex;align-items:center;gap:12px;
  padding:14px var(--bosluk);
  background:var(--kart);border:1px solid var(--cizgi);border-radius:var(--yuvarlak);
  width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
}
.blok:disabled{cursor:default;opacity:.55}
.blok .no{
  flex:0 0 40px;height:40px;display:grid;place-items:center;
  border-radius:10px;background:var(--zemin);
  font-family:var(--display);font-size:17px;font-weight:600;
}
.blok.bitti .no{background:var(--murekkep);color:var(--zemin)}
.blok .govde{flex:1;min-width:0;display:block}
.blok .ad{display:block;font-weight:600;font-size:15px}
.blok .alt{display:block;font-size:13px;color:var(--soluk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.rozet{
  font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;
  border:1px solid var(--cizgi);color:var(--soluk);white-space:nowrap;
}
.rozet.zayif{background:var(--fosforlu);border-color:var(--fosforlu);color:var(--vurgu-yazi)}
.rozet.iyi{border-color:var(--dogru);color:var(--dogru)}

/* --- konu satiri (sonuc) --- */
.konu-satir{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-bottom:1px solid var(--cizgi);
}
.konu-satir:last-child{border-bottom:none}
.konu-satir .ad{flex:1;min-width:0;font-size:15px}
.konu-satir .ad small{display:block;color:var(--soluk);font-size:12.5px}
.konu-satir .oran{font-family:var(--display);font-weight:600;font-size:15px}
.vurgu{background:var(--fosforlu);color:var(--vurgu-yazi);border-radius:3px;padding:0 4px}

/* --- form --- */
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input[type=password],input[type=text]{
  width:100%;min-height:48px;padding:12px 14px;
  border:1px solid var(--cizgi);border-radius:10px;background:var(--kart);
  font-family:var(--mono);font-size:15px;color:inherit;
}
.satir{display:flex;gap:10px;flex-wrap:wrap}

select{
  width:100%;min-height:48px;padding:12px 14px;
  border:1px solid var(--cizgi);border-radius:10px;background:var(--kart);
  font-family:inherit;font-size:15px;color:inherit;
}
input[type=range]{
  width:100%;height:44px;margin:0;accent-color:var(--murekkep);cursor:pointer;
}

/* --- sekmeler (Basit / Gelismis) --- */
.sekmeler{
  display:flex;gap:6px;background:var(--cizgi);
  border-radius:12px;padding:4px;margin:14px 0 16px;
}
.sekme{
  flex:1;min-height:40px;display:grid;place-items:center;
  border-radius:9px;font-size:14.5px;font-weight:600;
  color:var(--soluk);text-decoration:none;
}
.sekme.aktif{background:var(--kart);color:var(--murekkep);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.secenek-satir{
  display:flex;align-items:center;gap:12px;
  min-height:44px;margin:0;cursor:pointer;font-size:15px;font-weight:500;
}
.secenek-satir input[type=checkbox]{
  width:22px;height:22px;flex:0 0 22px;margin:0;
  accent-color:var(--murekkep);cursor:pointer;
}

.bildirim{padding:12px 14px;border-radius:10px;font-size:14.5px;margin-bottom:12px}
.bildirim.ok{background:color-mix(in srgb, var(--dogru) 12%, var(--kart));border:1px solid color-mix(in srgb, var(--dogru) 40%, var(--kart));color:var(--dogru)}
.bildirim.hata{background:color-mix(in srgb, var(--yanlis) 12%, var(--kart));border:1px solid color-mix(in srgb, var(--yanlis) 40%, var(--kart));color:var(--yanlis)}

.bos{
  text-align:center;padding:40px 20px;color:var(--soluk);
}

/* --- okuma modu --- */
.okuma-govde{
  background:var(--kart);border:1px solid var(--cizgi);border-radius:var(--yuvarlak);
  padding:var(--bosluk);margin-bottom:14px;
}
.okuma-paragraf{
  font-family:var(--mono);font-size:15.5px;line-height:2;
  margin:0 0 14px;
}
.okuma-paragraf:last-child{margin-bottom:0}

.cumle{border-radius:4px;transition:background .15s}
.cumle.acik{background:var(--sik-secili);box-shadow:0 0 0 2px var(--sik-secili)}

.kelime{
  cursor:pointer;border-radius:3px;padding:1px 1px;
  -webkit-tap-highlight-color:transparent;
}
.kelime:hover{background:var(--sik-secili)}
.kelime.acik{background:var(--fosforlu);color:var(--vurgu-yazi)}

.okuma-panel-kart{
  position:sticky;bottom:12px;
  box-shadow:0 6px 24px rgba(0,0,0,.22);
}
.panel-baslik{font-family:var(--display);font-weight:600;font-size:19px}

/* imza oge: cumle seridi — kelime bloklari ve altlarinda rolleri */
.serit{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.serit-blok{
  display:flex;flex-direction:column;gap:2px;
  padding:8px 11px;border-radius:9px;
  background:var(--zemin);border:1px solid var(--cizgi);
  cursor:pointer;position:relative;overflow:hidden;
}
.serit-metin{font-family:var(--mono);font-size:14.5px;position:relative;z-index:1}
.serit-blok.cizili .serit-metin{color:var(--vurgu-yazi)}
.serit-rol{font-size:11.5px;color:var(--soluk);position:relative;z-index:1}
.serit-blok.cizili{border-color:var(--fosforlu)}
.serit-blok.cizili .serit-rol{color:var(--vurgu-yazi);font-weight:600}
/* fosforlu kalem darbesi soldan saga gecer */
.serit-blok.cizili::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:100%;
  background:var(--fosforlu);transform-origin:left;
  animation:kalem .32s ease-out forwards;
}
@keyframes kalem{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){
  .serit-blok.cizili::before{animation:none;transform:scaleX(1)}
}

/* --- aciklama karti --- */
.aciklama{
  border-left:3px solid var(--fosforlu);
  padding-left:14px;margin-top:14px;
}
.aciklama .bolum{margin-bottom:14px}
.aciklama .bolum:last-child{margin-bottom:0}
.aciklama .etiket{
  display:block;font-size:11.5px;font-weight:600;color:var(--soluk);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;
}
.aciklama .govde{font-size:14.5px;line-height:1.6}
.aciklama .kural-metni{font-size:15px;line-height:1.65}

.benzer{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.benzer li{
  font-family:var(--mono);font-size:14px;line-height:1.6;
  background:var(--zemin);border-radius:8px;padding:9px 12px;
}
.benzer .cevap{
  background:var(--fosforlu);color:var(--vurgu-yazi);border-radius:3px;padding:0 5px;margin-left:6px;
  font-weight:500;cursor:pointer;
}
.benzer .cevap.gizli{background:var(--cizgi);color:transparent;user-select:none}

/* --- sohbet --- */
.sohbet{margin-top:16px;border-top:1px solid var(--cizgi);padding-top:14px}
.mesajlar{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.mesaj{font-size:14.5px;line-height:1.6;padding:10px 13px;border-radius:12px;max-width:88%;white-space:pre-wrap}
.mesaj.kullanici{align-self:flex-end;background:var(--murekkep);color:var(--zemin);border-bottom-right-radius:4px}
.mesaj.ai{align-self:flex-start;background:var(--zemin);border-bottom-left-radius:4px}

/* hazir soru onerileri */
.oneri-liste{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.oneri{
  min-height:36px;padding:8px 13px;
  background:var(--kart);border:1px solid var(--cizgi);border-radius:99px;
  font-size:13.5px;line-height:1.3;text-align:left;cursor:pointer;color:var(--soluk);
}
.oneri:hover{border-color:var(--murekkep);color:var(--murekkep)}

textarea{
  width:100%;min-height:48px;padding:12px 14px;resize:vertical;
  border:1px solid var(--cizgi);border-radius:10px;background:var(--kart);
  font-family:inherit;font-size:15px;line-height:1.5;color:inherit;
}

.yukleniyor{color:var(--soluk);font-size:14px}
.yukleniyor::after{
  content:"";display:inline-block;width:1em;text-align:left;
  animation:nokta 1.2s steps(4,end) infinite;
}
@keyframes nokta{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="ust">
  <span class="marka">WordNexus</span>
  <span class="bosluk"></span>
  <a href="#/" class="dugme ikincil" style="min-height:44px;padding:10px 14px;text-decoration:none">Ana sayfa</a>
  <a href="#/ayarlar" class="dugme ikincil" style="min-height:44px;padding:10px 14px;text-decoration:none">Ayarlar</a>
</header>
<main id="ekran"><p class="soluk">Yükleniyor…</p></main>
<script>
// Tema tercihini erken uygula ki sayfa acilirken beyaz yanip sonmesin.
try {
  const t = localStorage.getItem("tema");
  const koyu = t === "koyu" || (!t && matchMedia("(prefers-color-scheme: dark)").matches);
  if (koyu) document.documentElement.dataset.tema = "koyu";
} catch {}
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
